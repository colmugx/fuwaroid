name: pull request check

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install moon (Unix)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: moon version --all

      - name: moon update
        run: moon update

      - name: moon check (native)
        run: moon check --target native --output-json

      - name: moon check (js)
        run: moon check --target js --output-json
