name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: moon version --all

      - name: Resolve dependencies
        run: moon update

      - name: Check
        run: moon check --output-json

      - name: Test
        run: moon test --output-json

      - name: Resolve quickstart dependencies
        run: moon -C examples/quickstart update

      - name: Check quickstart
        run: moon -C examples/quickstart check --output-json

      - name: Test quickstart
        run: moon -C examples/quickstart test --output-json

      - name: Run quickstart
        run: moon -C examples/quickstart run .
