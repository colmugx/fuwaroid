name: Concurrency benchmark

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: MoonBit toolchain (latest or a released version; pin for comparable runs)
        default: 'latest'
        required: true
        type: string
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: concurrency-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit (official installer)
        shell: bash
        env:
          MOONBIT_TOOLCHAIN: ${{ inputs.toolchain || 'latest' }}
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_TOOLCHAIN"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record installed toolchain
        run: moon version --all
      - name: Resolve dependencies
        run: moon update
      - name: Check and test
        run: |
          moon check --target native --output-json
          moon test --target native --output-json
      - name: Measure release workloads and write report
        timeout-minutes: 25
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            moon run --target native tools/concurrency-ci.mbtx smoke
          else
            moon run --target native tools/concurrency-ci.mbtx
          fi
      - name: Preserve report and raw evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-benchmark-${{ github.sha }}-${{ github.run_attempt }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30
