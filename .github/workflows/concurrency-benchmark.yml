name: Concurrency benchmark

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: MoonBit toolchain (keep identical when comparing runs)
        default: '0.10.14+7d59c7ec9'
        required: true
        type: string
  push:
    branches: [main, perf/specialize-spawn-fold]

permissions:
  contents: read

concurrency:
  group: concurrency-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: ${{ inputs.toolchain || '0.10.14+7d59c7ec9' }}
          core-version: ${{ inputs.toolchain || '0.10.14+7d59c7ec9' }}
      - name: Resolve dependencies
        run: moon update
      - name: Check and test
        run: |
          moon check --target native --output-json
          moon test --target native --output-json
      - name: Measure release workloads and write report
        timeout-minutes: 25
        run: moon run tools/concurrency-ci.mbtx --target native
      - name: Preserve report and raw evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-benchmark-${{ github.sha }}-${{ github.run_attempt }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30
